services:
  - type: web
    name: fra-backend-api
    env: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/generate_geojson.py && python scripts/generate_mock_data.py"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///database/fra.db
